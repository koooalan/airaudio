<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AirAudio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      background: #1c1c1e;
      border-radius: 18px;
      overflow: hidden;
    }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #1c1c1e;
      color: #fff;
      padding: 14px 16px 12px;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    .header {
      font-weight: 600;
      font-size: 14px;
      letter-spacing: -0.2px;
      margin-bottom: 12px;
    }

    /* ── Status card ─────────────────────────────────────────── */
    .status-card {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      background: #2c2c2e;
      border-radius: 8px;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .dot.streaming { background: #00ff55; }
    .dot.idle      { background: #636366; }
    .status-text {
      flex: 1;
      font-size: 12px;
      color: rgba(235,235,245,0.8);
    }
    .latency {
      font-size: 11px;
      color: #8e8e93;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* ── Footer ──────────────────────────────────────────────── */
    .footer {
      margin-top: 10px;
      font-size: 10px;
      color: #4a4a48;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">♫ AirAudio</div>

  <div class="status-card">
    <span class="dot idle" id="dot"></span>
    <span class="status-text" id="status">Checking…</span>
    <span class="latency" id="latency"></span>
  </div>

  <div class="footer">Connects to AirAudio on this PC</div>

  <script src="popup.js"></script>
</body>
</html>
